# Huawei MateBook X Pro - AI Digital Microphone Noise Cancelling
# Powered by RNNoise and PipeWire Filter-Chain

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Huawei MateBook X Pro (AI Noise-Cancelled Mic)"
            media.name       = "Huawei MateBook X Pro (AI Noise-Cancelled Mic)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "/usr/lib/ladspa/librnnoise_ladspa.so"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" 50.0
                        }
                    }
                ]
            }
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "matebook_mic_raw_in"
                node.passive = true
            }
            playback.props = {
                node.name = "matebook_mic_rnnoise"
                node.description = "Huawei MateBook X Pro (Studio AI Mic)"
                media.class = Audio/Source
            }
        }
    }
]
